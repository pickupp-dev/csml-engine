version: "2.1"

services:
  postgres:
    image: postgres:alpine
    environment:
      - POSTGRES_USER=csml
      - POSTGRES_PASSWORD=
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_DB=csml
    ports:
      - 5432:5432

  csml:
    build:
      context: .
      dockerfile: Dockerfile
    # image: ghcr.io/pickupp-dev/csml-engine:v1.11.2-10
    environment:
      ENGINE_DB_TYPE: postgresql
      POSTGRESQL_URL: postgres://csml@postgres/csml
      ENGINE_SERVER_PORT: "5000"
      ENGINE_SERVER_API_KEYS: key1,key2
      ENGINE_ENCRYPTION_SECRET: secret1
      TTL_DURATION: "30"
      LOW_DATA_MODE: "true"
      DISABLE_SSL_VERIFY: "true"
      DEBUG: "false"
      CSML_LOG_LEVEL: warn
    ports:
      - 5005:5000
